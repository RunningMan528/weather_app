# Android QA 分发流水线
#
# 结构：GitHub Actions 只做调度与凭证准备，真正的构建/签名/分发逻辑在 Fastlane
#      （bundle exec fastlane android qa），因此迁移到 GitLab CI / CircleCI 时只需替换本文件。
# 触发：手动（workflow_dispatch）+ 推送到 main 且命中路径过滤。
name: Android QA 分发

on:
  workflow_dispatch:
    inputs:
      build_env:
        description: "构建环境（对应 config/<env>.json）"
        type: choice
        options: [qa, prod]
        default: qa
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "config/**"
      - ".flutter-version"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "scripts/ci/**"
      - ".github/workflows/android-qa.yml"

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    name: 构建 APK 并分发
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 构建环境：手动触发时可选 qa/prod；push 触发默认 qa。
      # 对应 config/<BUILD_ENV>.json，由 Fastlane 通过 --dart-define-from-file 注入。
      BUILD_ENV: ${{ inputs.build_env || 'qa' }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
      FIREBASE_CONSOLE_URL: ${{ vars.FIREBASE_CONSOLE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 生成唯一构建号
        # run_number * 100 + run_attempt：跨运行递增，同一次运行的失败重试也不会复用上传号。
        run: |
          set -euo pipefail
          attempt="${GITHUB_RUN_ATTEMPT:-1}"
          echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER * 100 + attempt ))" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        # 为什么要做：Flutter 的 Android release 构建非常占磁盘（本项目本机跑一次
        # build/ 就有约 5.7GB 中间产物），而托管 Runner 的 / 只有约 14GB 可用，
        # 典型失败是构建到一半报 "No space left on device"，在 fastlane 里同样表现为
        # "Exit status of command 'flutter build apk --release ...' was 1 instead of 0"。
        # 只删与本项目无关的预装工具链；Android SDK / NDK 一个都不动。
        run: |
          set -euo pipefail
          echo "清理前可用空间：$(df -h / | awk 'NR==2 {print $4}')"
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          echo "清理后可用空间：$(df -h / | awk 'NR==2 {print $4}')"

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 读取项目 Flutter 版本
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 配置 Ruby 与 Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: 缓存 Gradle 依赖
        # 目的：省掉每次构建重新下载 AGP / Kotlin / androidx 依赖的时间（首次约 1~3 分钟），
        #       同时降低"下载依赖时网络抖动 → 构建失败"的概率。
        # key 里带上 gradle-wrapper.properties 与 gradle.properties：
        # 升级 Gradle 或改 JVM 参数时不会命中过期缓存。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装 Android 签名材料
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci/setup_android_signing.sh

      - name: 准备 Firebase 服务账号
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "未配置 FIREBASE_SERVICE_ACCOUNT_JSON：本次只构建，不分发。"
            exit 0
          fi
          # 只写文件、不回显内容；密钥不会进入日志。
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: 构建与分发（Fastlane）
        # tee 到文件：失败时由下一步把根因从长日志里摘出来（Gradle 输出很长，人工翻很容易漏）。
        # set -o pipefail 是必须的：否则管道会把 fastlane 的失败退出码换成 tee 的 0，
        # 步骤会"假成功"，问题被推迟到分发环节才暴露。
        run: |
          set -o pipefail
          bundle exec fastlane android qa 2>&1 | tee "$RUNNER_TEMP/fastlane.log"

      - name: 失败诊断（内存 / 磁盘 / 根因摘要）
        # 只在失败时跑：把最可能的根因直接摘到日志末尾，省掉"翻 2000 行 Gradle 输出"的痛苦。
        if: failure()
        run: |
          set +e
          echo "======== 运行环境 ========"
          echo "CPU 核数: $(nproc)"
          free -h
          df -h /
          echo
          echo "======== 根因候选（从 fastlane 日志中提取）========"
          grep -n -i -m 60 -E \
            "FAILURE:|What went wrong|Caused by:|Execution failed for task|error:|No space left|ENOSPC|OutOfMemory|daemon disappeared|Killed|Could not resolve|Could not GET|Could not download|Read timed out|NDK|cmake|native assets|Unsupported class file" \
            "$RUNNER_TEMP/fastlane.log" \
            || echo "（未匹配到已知模式：请看上面完整日志，或把日志贴出来一起看）"
          echo
          echo "======== Android SDK / NDK 现状 ========"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "（Runner 上未预装 NDK）"
          flutter doctor -v 2>&1 | head -30 || true

      - name: 上传 APK 产物（排错留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 7
